<!DOCTYPE html>
<!-- =========================================================================
  index.html – KHUNG CẢNH CHÍNH "VỊNH HẠ LONG VR – DU THUYỀN HOÀNG HÔN"
  -------------------------------------------------------------------------
  - Nạp A-Frame (bản local trong lib/, thiếu thì tải từ CDN).
  - Nạp các file component trong js/ (mỗi file 1 phần của khung cảnh).
  - Khai báo khung cảnh bằng thẻ HTML: <a-scene> chứa các <a-entity>,
    mỗi entity gắn component tương ứng (bau-troi, bien, dao-da-voi...).
  Chạy: nhấp đúp file này, hoặc mở bằng VS Code Live Server.
========================================================================== -->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Vịnh Hạ Long VR – Du thuyền hoàng hôn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- favicon rỗng: tránh trình duyệt đi tìm favicon.ico (lỗi 404 trong console) -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">

  <!-- 1) A-Frame 1.6.0: ưu tiên file local để chạy offline -->
  <script src="lib/aframe.min.js"></script>
  <script>
    // Nếu thiếu file local (window.AFRAME chưa có) → tải từ CDN chính thức
    if (!window.AFRAME) {
      document.write('<script src="https://aframe.io/releases/1.6.0/aframe.min.js"><\/script>');
    }
  </script>

  <!-- 2) Các component tự viết. tien-ich.js phải đứng ĐẦU vì các file sau dùng ngay
          HALONG.glsl, HALONG.smoothstep... khi vừa được nạp. Các file còn lại chỉ dùng
          dữ liệu của nhau lúc component khởi tạo (sau khi mọi file đã nạp xong). -->
  <script src="js/tien-ich.js"></script>
  <script src="js/bau-troi.js"></script>
  <script src="js/bien.js"></script>
  <script src="js/thuyen.js"></script>      <!-- tạo lộ trình (HALONG.LO_TRINH): đảo dùng để chừa luồng -->
  <script src="js/dao-da-voi.js"></script>
  <script src="js/lang-chai.js"></script>
  <script src="js/hang-dong.js"></script>
  <script src="js/sinh-vat.js"></script>
  <script src="js/dieu-khien.js"></script>
  <script src="js/diem-thong-tin.js"></script>
  <script src="js/am-thanh.js"></script>
  <script src="js/giao-dien.js"></script>
</head>
<body>
  <!-- MÀN HÌNH CHỜ: hiện ngay khi trang mở (trước cả lúc A-Frame dựng xong khung cảnh).
       Nút "Bắt đầu" chỉ bấm được khi khung cảnh đã dựng + biên dịch shader xong.
       Bấm nút = thao tác của người dùng → trình duyệt mới cho phép phát âm thanh.
       Hình đảo đá vôi là SVG viết tay ngay trong trang (không tải ảnh ngoài). -->
  <div id="man-hinh-cho" role="dialog" aria-labelledby="mhc-tieu-de">
    <svg class="mhc-dao" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <circle cx="600" cy="236" r="70" fill="#ffd58a" opacity="0.85"/>
      <path fill="#3b2447" d="M0 300 V250 C40 250 50 170 90 165 C130 160 140 245 175 250 H230 C250 250 255 120 300 110 C350 100 345 240 380 250 H520 C540 250 545 200 575 195 C600 192 610 250 630 250 H760 C790 250 790 130 840 120 C895 110 880 245 915 250 H990 C1010 250 1020 185 1060 180 C1100 176 1100 250 1130 250 H1200 V300 Z"/>
      <path fill="#22142e" d="M0 300 V268 C60 268 70 215 110 212 C150 210 150 268 190 268 H420 C440 268 450 225 480 222 C510 220 515 268 540 268 H860 C890 268 900 205 940 200 C985 196 980 268 1010 268 H1200 V300 Z"/>
    </svg>
    <div class="mhc-khung">
      <h1 id="mhc-tieu-de">Vịnh Hạ Long VR</h1>
      <p class="mhc-phu-de">Du thuyền hoàng hôn</p>
      <div class="mhc-thanh" aria-hidden="true"><div></div></div>
      <p class="mhc-trang-thai" id="mhc-trang-thai" aria-live="polite">Đang dựng vịnh Hạ Long…</p>
      <button id="nut-bat-dau" type="button" disabled>Bắt đầu</button>
      <ul class="mhc-meo">
        <li>Thuyền tự chạy qua 5 điểm tham quan. Phím <b>M</b> để rời thuyền bay tự do.</li>
        <li>Bấm vào biểu tượng <b>i</b> nổi trên cảnh để đọc thuyết minh.</li>
        <li>Có âm thanh: nên đeo tai nghe. Phím <b>T</b> tắt / bật tiếng.</li>
      </ul>
    </div>
  </div>

  <!--
    renderer:
      antialias      : khử răng cưa
      alpha: false   : canvas không trong suốt (trình duyệt đỡ phải trộn với trang web)
      physicallyCorrectLights: đơn vị ánh sáng vật lý (chuẩn mới của three.js; A-Frame
                       mặc định là kiểu cũ) → bau-troi.js nhân cường độ đèn với π
      toneMapping    : ACESFilmic – nén vùng quá sáng (mặt trời) cho giống ảnh chụp
    light="defaultLightsEnabled: false": tắt đèn mặc định của A-Frame, dùng đèn
      riêng do bau-troi.js tạo.
    keyboard-shortcuts="enterVR: false": tắt phím F (A-Frame mặc định dùng F để vào VR;
      máy không có kính thì F làm khung 3D toàn màn hình và che mất bảng HUD).
    xr-mode-ui: nút kính VR góc phải (giao-dien.js tự ẩn nút nếu máy không hỗ trợ VR).
    loading-screen="enabled: false": dùng màn hình chờ riêng ở trên (có nút Bắt đầu).
    cursor + raycaster: bấm chuột / chạm vào biểu tượng "i" (class diem-tt) để mở bảng
      thuyết minh. Raycaster CHỈ xét các vật có class diem-tt và 12,5 lần/giây → rất nhẹ.
  -->
  <a-scene
    renderer="antialias: true; alpha: false; colorManagement: true; physicallyCorrectLights: true; toneMapping: ACESFilmic; exposure: 1.1"
    light="defaultLightsEnabled: false"
    keyboard-shortcuts="enterVR: false"
    xr-mode-ui="enabled: true"
    loading-screen="enabled: false"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .diem-tt; far: 400; interval: 80"
    giao-dien>

    <!-- Bầu trời + mặt trời/mặt trăng + ánh sáng. Bắt đầu lúc hoàng hôn;
         phím 1 2 3 hoặc nút góc phải để đổi Ngày / Hoàng hôn / Đêm -->
    <a-entity id="bau-troi" bau-troi="cheDo: hoangHon"></a-entity>

    <!-- Mặt biển có sóng -->
    <a-entity id="mat-bien" bien></a-entity>

    <!-- Quần đảo đá vôi: 60 đảo ngẫu nhiên (có seed) + các đảo nổi bật theo lộ trình -->
    <a-entity id="quan-dao" dao-da-voi="soDao: 60; hatGiong: 1994"></a-entity>

    <!-- Làng chài nổi (nhà bè, lồng bè, thuyền nan, đèn lồng) -->
    <a-entity id="lang-chai" lang-chai></a-entity>

    <!-- Hang Sửng Sốt: lòng hang + nhũ đá phát quang (cửa hang khoét trong đảo Bồ Hòn) -->
    <a-entity id="hang-dong" hang-dong></a-entity>

    <!-- Sinh vật: đàn hải âu bay theo thuyền, đom đóm ban đêm -->
    <a-entity id="sinh-vat" hai-au dom-dom></a-entity>

    <!-- Điểm thông tin (biểu tượng "i" bấm được) + bảng thuyết minh 3D -->
    <a-entity id="diem-thong-tin" diem-thong-tin></a-entity>

    <!-- Âm thanh tạo bằng code (Web Audio): sóng, gió, hải âu, côn trùng, giọt nước trong hang -->
    <a-entity id="am-thanh" am-thanh></a-entity>

    <!-- Thuyền buồm + du thuyền tự động theo lộ trình.
         Lưu ý: A-Frame chạy tick() theo LOẠI component (thứ tự đăng ký), không theo
         thứ tự thẻ HTML. dieu-khien khai báo after: ['du-thuyen'] để thuyền di chuyển
         trước, rig bám theo sau (nếu ngược lại, người trên boong bị trễ 1 khung → rung). -->
    <a-entity id="thuyen" thuyen-buom du-thuyen></a-entity>

    <!-- Người dùng: rig (để di chuyển) chứa camera (để nhìn quanh).
         Chế độ "du-thuyen": rig đứng trên boong, đi theo thuyền.
         Camera cao 1.6 m so với chân (tầm mắt). -->
    <a-entity id="rig" dieu-khien="cheDo: du-thuyen">
      <a-entity id="camera" position="0 1.6 0"
                camera="near: 0.1; far: 4000"
                look-controls="pointerLockEnabled: false; magicWindowTrackingEnabled: true"></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
